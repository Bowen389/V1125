name: Daily S-Tier Strategies Scan

on:
  schedule:
    # 北京时间 09:31 开盘缺口筛选 (UTC 01:31, Mon-Fri)
    - cron: '31 1 * * 1-5'
    # 北京时间 17:00 盘后首扫 (UTC 09:00, Mon-Fri)
    - cron: '0 9 * * 1-5'
    # 北京时间 17:30 盘后补扫 (UTC 09:30, Mon-Fri)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (postclose or opening)'
        required: false
        default: 'postclose'
        type: choice
        options:
          - postclose
          - opening
      date:
        description: 'Optional YYYY-MM-DD'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore TDX daily cache
        uses: actions/cache@v4
        with:
          path: .cache/tdx
          key: tdx-daily-${{ github.run_id }}
          restore-keys: |
            tdx-daily-

      - name: Run strategy scan
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          CRON_EXPR: ${{ github.event.schedule }}
        run: |
          if [ "$INPUT_MODE" = "opening" ] || [ "$CRON_EXPR" = "31 1 * * 1-5" ]; then
            if [ -n "$INPUT_DATE" ]; then
              python src/run.py --opening --date "$INPUT_DATE"
            else
              python src/run.py --opening
            fi
          else
            if [ -n "$INPUT_DATE" ]; then
              python src/run.py --date "$INPUT_DATE"
            else
              python src/run.py
            fi
          fi

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily S-tier strategy scan"
            git push
          else
            echo "No changes to commit."
          fi
